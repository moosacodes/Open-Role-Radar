name: Monthly Archive

on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: Archive month (YYYY-MM). Defaults to previous calendar month.
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: openroleradar-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Export monthly dataset
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Restore live state
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: Create archive
        working-directory: engine
        run: |
          MONTH_ARG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            MONTH_ARG="--month ${{ github.event.inputs.month }}"
          fi
          uv run openroleradar archive $MONTH_ARG

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-archive
          path: .local/archives/
          retention-days: 90
          if-no-files-found: error
