name: Source Discovery

on:
  schedule:
    # Discovery every 6 hours so new ATS boards land in live-state quickly.
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      github:
        description: Run GitHub code search discovery
        type: boolean
        default: true
      common_crawl:
        description: Run Common Crawl index discovery
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: openroleradar-discover
  cancel-in-progress: false

jobs:
  discover:
    name: Discover new sources
    runs-on: ubuntu-latest
    # Discovery writes candidate lists only on the default branch with elevated token.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Restore live state
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: Run discovery
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--publish"
          if [ "${{ github.event.inputs.github }}" = "false" ]; then
            ARGS="$ARGS --no-github"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.common_crawl }}" = "true" ]; then
            ARGS="$ARGS --common-crawl"
          fi
          uv run openroleradar discover $ARGS

      - name: Save live state
        if: success()
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}
