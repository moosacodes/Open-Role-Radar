name: Source Discovery

on:
  schedule:
    # Every 3 hours — land new ATS boards in seeds + live-state quickly.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      github:
        description: Run GitHub code search discovery
        type: boolean
        default: true
      common_crawl:
        description: Run Common Crawl index discovery
        type: boolean
        default: true
      harvest:
        description: Harvest + Simplify seed expansion into sources.yml
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: openroleradar-discover
  cancel-in-progress: false

jobs:
  discover:
    name: Discover + expand sources
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Restore live state
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-main-${{ github.run_id }}-discover
          restore-keys: |
            live-state-main-
            live-state-

      - name: Expand seeds from Simplify
        if: github.event_name == 'schedule' || github.event.inputs.harvest != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project engine python scripts/seed-from-simplify.py

      - name: Harvest ATS tenants from GitHub code search
        if: github.event_name == 'schedule' || github.event.inputs.harvest != 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project engine python scripts/harvest-ats-tenants.py

      - name: Commit expanded sources.yml
        if: github.event_name == 'schedule' || github.event.inputs.harvest != 'false'
        run: |
          set -euo pipefail
          if git diff --quiet -- config/sources.yml; then
            echo "No seed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.yml
          git commit -m "Expand ATS seed boards from Simplify + GitHub harvest."
          git push origin HEAD

      - name: Run discovery into live state
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS="--publish"
          if [ "${{ github.event.inputs.github }}" = "false" ]; then
            ARGS="$ARGS --no-github"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.common_crawl }}" = "true" ]; then
            ARGS="$ARGS --common-crawl"
          fi
          uv run openroleradar discover $ARGS

      - name: Save live state
        if: success()
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-main-${{ github.run_id }}
