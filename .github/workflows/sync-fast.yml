name: Sync Fast Path

# Sharded parallel poll of public Greenhouse / Lever / Ashby boards + Simplify
# discovery, then a single merge/publish job that always updates live-feed.

on:
  schedule:
    # GitHub Actions practical floor ~5 minutes — beat Simplify's ~30m GitHub dump.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Do not cancel an in-flight publish — a cancelled run never updates live-feed
  # and paints the README badge red.
  group: openroleradar-sync-fast
  cancel-in-progress: false

jobs:
  poll:
    name: Poll shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync Python dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Restore live state cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          # Prefer the last merged publish state so shards share one baseline.
          key: live-state-main-${{ github.run_id }}-shard-${{ matrix.shard }}
          restore-keys: |
            live-state-main-
            live-state-

      - name: Sync shard
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROLERADAR_ADAPTERS: greenhouse,lever,ashby,workable,smartrecruiters,simplify
          # Tighter budget: yield-ranked hotlist should finish well under this.
          OPENROLERADAR_MAX_SYNC_RUNTIME_MINUTES: "7"
          OPENROLERADAR_SHARD: ${{ matrix.shard }}
          OPENROLERADAR_SHARDS: "4"
        run: >
          uv run openroleradar sync
          --adapters greenhouse,lever,ashby,workable,smartrecruiters,simplify
          --shard ${{ matrix.shard }}
          --shards 4

      - name: Upload shard state
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: state-shard-${{ matrix.shard }}
          path: .local/state/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Merge + publish live-feed
    needs: poll
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Slim export should finish in a few minutes; keep headroom for push + release.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync Python dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Download shard states
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: state-shard-*
          path: .local/shards
          merge-multiple: false

      - name: Merge shard states
        working-directory: engine
        env:
          # Keep pydantic validation but avoid extra debug allocations.
          PYTHONOPTIMIZE: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          SHARDS=(../.local/shards/state-shard-*)
          if [ ${#SHARDS[@]} -eq 0 ]; then
            echo "No shard artifacts downloaded" >&2
            exit 1
          fi
          echo "Merging ${#SHARDS[@]} shard(s): ${SHARDS[*]}"
          du -sh "${SHARDS[@]}" || true
          uv run openroleradar merge-states "${SHARDS[@]}" --out ../.local/state

      - name: Fetch previous job-ids for delta
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p site/public/data site/public/data-wide
          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/live-feed/job-ids.json" \
            -o site/public/data/job-ids.json || rm -f site/public/data/job-ids.json
          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/live-feed/wide/job-ids.json" \
            -o site/public/data-wide/job-ids.json || rm -f site/public/data-wide/job-ids.json

      - name: Build data exports
        working-directory: engine
        env:
          # Skip Static API + full reclassify/state rewrite (was ~22m of the 25m budget).
          OPENROLERADAR_SLIM_EXPORT: "1"
          PYTHONOPTIMIZE: "1"
        run: uv run openroleradar build-data --slim

      - name: Publish live-feed branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d site/public/data ]; then
            echo "site/public/data missing — build-data did not export a feed" >&2
            exit 1
          fi
          WORK="$(mktemp -d)"
          cp -R site/public/data/. "$WORK/"
          if [ -d site/public/data-wide ]; then
            mkdir -p "$WORK/wide"
            cp -R site/public/data-wide/. "$WORK/wide/"
          fi
          if [ -d site/public/feeds ]; then
            mkdir -p "$WORK/feeds"
            cp -R site/public/feeds/. "$WORK/feeds/"
          fi
          cd "$WORK"
          git init
          git checkout -b live-feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' '# Live job feed — force-pushed every fast sync' > README.md
          git add -A
          git commit -m "live-feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin live-feed

      # Non-critical: never block the badge after live-feed is already published.
      - name: Publish durable live-state release
        continue-on-error: true
        timeout-minutes: 8
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run openroleradar publish-state

      - name: Save live state cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-main-${{ github.run_id }}
