name: Sync and Deploy

on:
  schedule:
    # Slower full pass (includes Workday). Fast path owns the 5-minute cadence.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: Sync only a small sample of sources
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: openroleradar-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync and publish live feed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync Python dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Restore live state
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: Run sync
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.sample }}" = "true" ]; then
            uv run openroleradar sync --sample
          else
            uv run openroleradar sync
          fi

      - name: Build data exports
        working-directory: engine
        run: uv run openroleradar build-data

      - name: Publish live-feed branch (what the site actually reads)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d site/public/data ]; then
            echo "site/public/data missing — build-data did not export a feed" >&2
            exit 1
          fi
          WORK="$(mktemp -d)"
          cp -R site/public/data/. "$WORK/"
          if [ -d site/public/data-wide ]; then
            mkdir -p "$WORK/wide"
            cp -R site/public/data-wide/. "$WORK/wide/"
          fi
          if [ -d site/public/feeds ]; then
            mkdir -p "$WORK/feeds"
            cp -R site/public/feeds/. "$WORK/feeds/"
          fi
          cd "$WORK"
          git init
          git checkout -b live-feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' '# Live job feed — force-pushed every sync' > README.md
          git add -A
          git commit -m "live-feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin live-feed

      - name: Publish durable live-state release
        continue-on-error: true
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run openroleradar publish-state

      - name: Save live state
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-${{ github.run_id }}
