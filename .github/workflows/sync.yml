name: Sync and Deploy

# Slow path: Workday + durable state only. Fast path owns live-feed publishes
# so a 30-minute full sync can never clobber a fresher 5-minute publish.

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: Sync only a small sample of sources
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: openroleradar-sync-slow
  cancel-in-progress: true

jobs:
  sync:
    name: Workday + durable state
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Sync Python dependencies
        working-directory: engine
        run: uv sync --all-extras --dev

      - name: Restore live state
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-main-${{ github.run_id }}-slow
          restore-keys: |
            live-state-main-
            live-state-

      - name: Run Workday sync
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROLERADAR_ADAPTERS: workday
        run: |
          if [ "${{ github.event.inputs.sample }}" = "true" ]; then
            uv run openroleradar sync --sample --adapters workday
          else
            uv run openroleradar sync --adapters workday
          fi

      - name: Publish durable live-state release
        continue-on-error: true
        working-directory: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run openroleradar publish-state

      - name: Save live state
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .local/state
          key: live-state-main-${{ github.run_id }}-slow
