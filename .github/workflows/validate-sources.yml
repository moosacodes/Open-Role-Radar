name: Validate Sources

on:
  pull_request:
    paths:
      - "config/sources.yml"
      - "config/aggregators-denylist.yml"
      - "config/ats-hosts.yml"
      - "scripts/validate-sources.py"
      - "schemas/source.schema.json"
      - ".github/workflows/validate-sources.yml"

permissions:
  contents: read

concurrency:
  group: validate-sources-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate config/sources.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Fork PRs receive a read-only token; no secrets are required or used.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install validation dependencies
        run: pip install pyyaml

      - name: Run source validator
        run: python scripts/validate-sources.py

      - name: Fork safety notice
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "Fork PR validation completed with read-only permissions."
          echo "No repository secrets or write access were used."
