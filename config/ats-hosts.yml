# Recognized ATS host patterns for detection and validation.
platforms:
  greenhouse:
    hosts:
      - boards.greenhouse.io
      - job-boards.greenhouse.io
      - boards-api.greenhouse.io
    api_pattern: "https://boards-api.greenhouse.io/v1/boards/{tenant}/jobs"
    board_pattern: "https://boards.greenhouse.io/{tenant}"
    supported: true

  lever:
    hosts:
      - jobs.lever.co
      - api.lever.co
    api_pattern: "https://api.lever.co/v0/postings/{tenant}"
    board_pattern: "https://jobs.lever.co/{tenant}"
    supported: true

  ashby:
    hosts:
      - jobs.ashbyhq.com
      - api.ashbyhq.com
    api_pattern: "https://api.ashbyhq.com/posting-api/job-board/{tenant}"
    board_pattern: "https://jobs.ashbyhq.com/{tenant}"
    supported: true

  smartrecruiters:
    hosts:
      - careers.smartrecruiters.com
      - api.smartrecruiters.com
    api_pattern: "https://api.smartrecruiters.com/v1/companies/{tenant}/postings"
    board_pattern: "https://careers.smartrecruiters.com/{tenant}"
    supported: true

  workday:
    hosts:
      - myworkdayjobs.com
      - wd1.myworkdayjobs.com
      - wd3.myworkdayjobs.com
      - wd5.myworkdayjobs.com
      - wd12.myworkdayjobs.com
    supported: true

  workable:
    hosts:
      - apply.workable.com
      - jobs.workable.com
    api_pattern: "https://apply.workable.com/api/v1/widget/accounts/{tenant}"
    board_pattern: "https://apply.workable.com/{tenant}"
    supported: true

  icims:
    hosts:
      - careers.icims.com
    supported: partial

  teamtailor:
    hosts:
      - career.teamtailor.com
      - jobs.teamtailor.com
    supported: partial

  recruitee:
    hosts:
      - recruitee.com
    supported: partial

  bamboohr:
    hosts:
      - bamboohr.com
    supported: partial

  successfactors:
    hosts:
      - successfactors.com
      - successfactors.eu
    supported: false

  oracle:
    hosts:
      - oraclecloud.com
    supported: false

  json_ld:
    hosts: []
    supported: true

  simplify:
    hosts:
      - raw.githubusercontent.com
    api_pattern: "https://raw.githubusercontent.com/SimplifyJobs/{tenant}/dev/.github/scripts/listings.json"
    board_pattern: "https://github.com/SimplifyJobs/{tenant}"
    supported: true

discovery_patterns:
  - boards.greenhouse.io
  - job-boards.greenhouse.io
  - boards-api.greenhouse.io
  - jobs.lever.co
  - api.lever.co
  - jobs.ashbyhq.com
  - api.ashbyhq.com/posting-api/job-board
  - careers.smartrecruiters.com
  - api.smartrecruiters.com/v1/companies
  - apply.workable.com
  - apply.workable.com/api/v1/widget/accounts
