# Central branding and project configuration — rename here, not across the codebase.
name: OpenRoleRadar
slug: openroleradar
display_name: OpenRoleRadar
tagline: Global early-career opportunity intelligence
description: >
  Zero-cost opportunity intelligence platform that polls first-party early-career
  roles from public ATS boards, classifies them, and publishes a searchable static site.
repository: moosacodes/Open-Role-Radar
website_url: https://moosacodes.github.io/Open-Role-Radar/
user_agent: OpenRoleRadar/1.0 (+https://github.com/moosacodes/Open-Role-Radar)

versions:
  state_format: 1
  static_api: 1
  job_schema: 1
  company_schema: 1
  source_schema: 1
  event_schema: 1
  parser: "1.0.0"
  classification: "1.0.0"

live_state:
  release_tag: live-state
  asset_name: state.tar.zst
  manifest_name: manifest.json
  checksums_name: SHA256SUMS

polling:
  tiers:
    hot_minutes: 2
    warm_minutes: 5
    cold_minutes: 8
    dormant_minutes: 20
  max_sources_per_sync: 2000
  # Soft budget so sync can save + export before the Actions job timeout.
  # Fast path overrides via OPENROLERADAR_MAX_SYNC_RUNTIME_MINUTES.
  max_sync_runtime_minutes: 45

http:
  timeout_seconds: 20
  max_redirects: 5
  # Large Ashby/Greenhouse boards exceed 10MB; keep headroom for full payloads.
  max_response_bytes: 33554432
  global_concurrency: 32
  # Shared ATS hosts (boards.greenhouse.io / api.lever.co) dominate the fast
  # path; 4 concurrent slots made ~500 boards overrun the 12m job timeout.
  per_host_concurrency: 12
  retry_max_attempts: 2
  retry_base_delay_seconds: 0.5
  retry_max_delay_seconds: 8.0

lifecycle:
  misses_before_suspected_closed: 2
  misses_before_closed: 4
  unhealthy_source_never_closes: true

closure:
  authoritative_status_codes: [404, 410]

sharding:
  max_shard_bytes: 2097152
  max_shard_jobs: 2000
  hash_buckets: 32

feeds:
  max_items: 500

discovery:
  github_search_per_run: 100
  common_crawl_per_run: 150
  quarantine_retry_hours: 48
  promotion_min_confidence: 0.55

health:
  adapter_failure_threshold: 0.5
  adapter_min_samples: 10

archive:
  prefix: dataset

classification:
  early_career_min_confidence: 0.55
  quarantine_below_confidence: 0.35
