# Seed sources — human-maintained first-party career boards.
# Unique by (domain, adapter, tenant). Validated by scripts/validate-sources.py.

# --- SimplifyJobs / SWE List (public GitHub listings; apply URLs stay first-party) ---
# SWE List emails alert on these same feeds. We ingest listings.json and keep roles
# whose apply link is an employer ATS / careers page (never LinkedIn/Indeed).
- { company: SimplifyJobs Internships, domain: summer2026-internships.github.io, adapter: simplify, tenant: summer2026-internships }
- { company: SimplifyJobs New Grad, domain: new-grad-positions.github.io, adapter: simplify, tenant: new-grad-positions }

