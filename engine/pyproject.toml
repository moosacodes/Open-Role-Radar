[project]
name = "openroleradar"
version = "1.0.0"
description = "Global early-career opportunity intelligence engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OpenRoleRadar Contributors" }]
dependencies = [
    "pydantic>=2.10,<3",
    "httpx[http2]>=0.28,<1",
    "h2>=4.1,<5",
    "typer>=0.15,<1",
    "tenacity>=9.0,<10",
    "selectolax>=0.3,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.3,<6",
    "pyyaml>=6.0,<7",
    "orjson>=3.10,<4",
    "pycountry>=24.6,<25",
    "zstandard>=0.23,<1",
    "jsonschema>=4.23,<5",
    "rich>=13.9,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "hypothesis>=6.120,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-pyyaml",
    "types-beautifulsoup4",
    "respx>=0.22,<1",
]

[project.scripts]
openroleradar = "openroleradar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openroleradar"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pycountry.*", "selectolax.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: live network smoke tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
