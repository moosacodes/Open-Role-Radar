name: OpenRoleRadar Personal Watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public feed
        run: |
          set -euo pipefail
          FEED="${{ vars.ORR_FEED_URL }}"
          if [ -z "$FEED" ]; then
            FEED="https://moosacodes.github.io/Open-Role-Radar/feeds/jobs.atom"
          fi
          curl -fsSL "$FEED" -o feed.atom

      - name: Filter matches
        env:
          KEYWORDS: ${{ vars.ORR_KEYWORDS || 'intern,new grad,graduate,co-op,coop' }}
          LOCATIONS: ${{ vars.ORR_LOCATIONS || '' }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {"a": "http://www.w3.org/2005/Atom"}
          root = ET.parse("feed.atom").getroot()
          keywords = [k.strip().lower() for k in os.environ.get("KEYWORDS", "").split(",") if k.strip()]
          locations = [l.strip().lower() for l in os.environ.get("LOCATIONS", "").split(",") if l.strip()]
          matches = []
          for entry in root.findall("a:entry", ns):
              title = (entry.findtext("a:title", default="", namespaces=ns) or "").lower()
              summary = (entry.findtext("a:summary", default="", namespaces=ns) or "").lower()
              link = entry.find("a:link", ns)
              href = link.get("href") if link is not None else ""
              blob = f"{title} {summary}"
              if keywords and not any(k in blob for k in keywords):
                  continue
              if locations and not any(l in blob for l in locations):
                  continue
              matches.append((entry.findtext("a:title", default="", namespaces=ns), href))
          Path("matches.txt").write_text(
              "\n".join(f"{t} | {u}" for t, u in matches[:50]),
              encoding="utf-8",
          )
          print(f"Matched {len(matches)} roles")
          PY

      - name: Open issue on matches
        if: hashFiles('matches.txt') != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('matches.txt', 'utf8');
            if (!body.trim()) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `OpenRoleRadar watch: ${body.split('\n').filter(Boolean).length} match(es)`,
              body: ['Matches from your OpenRoleRadar watch workflow:', '', '```', body, '```'].join('\n'),
              labels: ['openroleradar-watch']
            });

      - name: Discord webhook notify
        if: hashFiles('matches.txt') != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK not set — skipping"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          text = Path("matches.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit(0)
          content = "**OpenRoleRadar watch**\n" + "\n".join(text.splitlines()[:15])
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=json.dumps({"content": content[:1900]}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          urllib.request.urlopen(req, timeout=20)
          print("Discord notified")
          PY
